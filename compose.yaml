name: ${COMPOSE_PROJECT_NAME:-szeruj}

services:
  szeruj:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${SZERUJ_IMAGE:-szeruj:local}
    container_name: ${SZERUJ_CONTAINER_NAME:-szeruj}
    restart: unless-stopped
    init: true
    mem_limit: ${SZERUJ_MEMORY_LIMIT:-2g}
    user: "${SZERUJ_UID:-1000}:${SZERUJ_GID:-1000}"
    ports:
      - "${SZERUJ_BIND_ADDRESS:-0.0.0.0}:${SZERUJ_PORT:-8369}:3000"
    volumes:
      - type: bind
        source: ${SZERUJ_DATA_PATH:-./data}
        target: /data
      - type: bind
        source: ./.env
        target: /run/secrets/szeruj.env
        read_only: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 60s
      timeout: 3s
      start_period: 15s
      retries: 3
    stop_grace_period: 15s
